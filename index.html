<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriAgent PH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .agent-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .agent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        .agent-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .agent1 { background: #48bb78; }
        .agent2 { background: #4299e1; }
        .agent3 { background: #ed8936; }
        .agent-title {
            font-weight: 600;
            color: #2d3748;
        }
        .agent-tech {
            font-size: 12px;
            color: #718096;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .output {
            margin-top: 15px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            min-height: 100px;
            font-size: 14px;
            line-height: 1.6;
        }
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        .status.active { background: #c6f6d5; color: #22543d; }
        .status.processing { background: #fed7d7; color: #742a2a; }
        canvas {
            max-height: 200px;
        }
        .stream-data {
            background: #1a202c;
            color: #48bb78;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌾 AgriAgent PH</h1>
            <div class="subtitle">Multi-Agent AI System for Filipino Farmers & Cooperatives</div>
        </header>

        <div class="agents-grid">
            <!-- Agent 1: Predictive Yield Model -->
            <div class="agent-card">
                <div class="agent-header">
                    <div class="agent-icon agent1">📊</div>
                    <div>
                        <div class="agent-title">Agent 1: Yield Predictor</div>
                        <div class="agent-tech">Classic ML (Random Forest)</div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Crop Type</label>
                    <select id="crop">
                        <option>Palay (Rice)</option>
                        <option>Mais (Corn)</option>
                        <option>Coconut</option>
                        <option>Sugarcane</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Farm Area (hectares)</label>
                    <input type="number" id="area" value="2" min="0.1" step="0.1">
                </div>
                <div class="input-group">
                    <label>Soil pH</label>
                    <input type="number" id="ph" value="6.5" min="4" max="9" step="0.1">
                </div>
                <button onclick="predictYield()">Predict Yield</button>
                <div id="yield-output" class="output"></div>
                <canvas id="yield-chart"></canvas>
            </div>

            <!-- Agent 2: GenAI Advisor -->
            <div class="agent-card">
                <div class="agent-header">
                    <div class="agent-icon agent2">🤖</div>
                    <div>
                        <div class="agent-title">Agent 2: AI Farm Advisor</div>
                        <div class="agent-tech">GenAI + RAG (DA Bulletins)</div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Language / Wika</label>
                    <select id="lang">
                        <option>Tagalog</option>
                        <option>Bisaya</option>
                        <option>English</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Your Question / Tanong</label>
                    <textarea id="question" rows="3" placeholder="Ano ang tamang oras para magtanim ng palay?"></textarea>
                </div>
                <button onclick="getAdvice()">Get AI Advice</button>
                <div id="advice-output" class="output"></div>
                <div class="status active">RAG: DA Bulletin #2024-11 loaded</div>
            </div>

            <!-- Agent 3: Agentic Marketplace -->
            <div class="agent-card">
                <div class="agent-header">
                    <div class="agent-icon agent3">🚚</div>
                    <div>
                        <div class="agent-title">Agent 3: Smart Marketplace</div>
                        <div class="agent-tech">Agentic AI + APIs (Lazada/DA)</div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Harvest Amount (kg)</label>
                    <input type="number" id="harvest" value="1000" min="1">
                </div>
                <div class="input-group">
                    <label>Target Price (₱/kg)</label>
                    <input type="number" id="price" value="25" min="1">
                </div>
                <button onclick="findBuyers()">Find Buyers & Arrange Logistics</button>
                <div id="market-output" class="output"></div>
                <div class="stream-data" id="stream"></div>
            </div>
        </div>
    </div>

    <script>
        let yieldChart = null;
        const streamEl = document.getElementById('stream');

        // Agent 1: Predictive Yield Model (Simulated ML)
        function predictYield() {
            const crop = document.getElementById('crop').value;
            const area = parseFloat(document.getElementById('area').value);
            const ph = parseFloat(document.getElementById('ph').value);
            const output = document.getElementById('yield-output');
            
            output.innerHTML = '<span class="loading"></span> Processing ML model...';
            
            setTimeout(() => {
                // Simulated Random Forest prediction
                const baseYield = {'Palay (Rice)': 4.2, 'Mais (Corn)': 5.8, 'Coconut': 1.2, 'Sugarcane': 65}[crop];
                const phFactor = 1 - Math.abs(ph - 6.5) * 0.1;
                const predicted = (baseYield * area * phFactor).toFixed(2);
                const confidence = (85 + Math.random() * 10).toFixed(1);
                
                output.innerHTML = `
                    <strong>Predicted Yield:</strong> ${predicted} tons<br>
                    <strong>Model Confidence:</strong> ${confidence}%<br>
                    <strong>Recommendation:</strong> ${ph < 6 ? 'Add lime to raise pH' : 'Optimal soil conditions'}
                `;
                
                renderChart([3.2, 3.8, 4.1, predicted, 4.5, 4.8]);
            }, 1500);
        }

        function renderChart(data) {
            const ctx = document.getElementById('yield-chart');
            if (yieldChart) yieldChart.destroy();
            
            yieldChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Current', 'May', 'Jun'],
                    datasets: [{
                        label: 'Yield (tons)',
                        data: data,
                        borderColor: '#48bb78',
                        backgroundColor: 'rgba(72, 187, 120, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Agent 2: GenAI with RAG
        async function getAdvice() {
            const lang = document.getElementById('lang').value;
            const question = document.getElementById('question').value;
            const output = document.getElementById('advice-output');
            
            if (!question) return;
            
            output.innerHTML = '<span class="loading"></span> Consulting DA bulletins + AI...';
            
            // Simulated GenAI response with RAG
            setTimeout(() => {
                const responses = {
                    'Tagalog': `Ayon sa DA Bulletin 2024-11, ang pinakamainam na panahon para sa pagtatanim ng palay ay Hunyo-Hulyo (wet season) at Disyembre-Enero (dry season). Siguraduhin ang 5-6 inches ng tubig sa palayan at gumamit ng certified seeds mula sa PhilRice.`,
                    'Bisaya': `Sumala sa DA Bulletin 2024-11, ang labing maayo nga panahon para sa pagtanom sa humay mao ang Hunyo-Hulyo (tag-ulan) ug Disyembre-Enero (ting-init). Siguroha ang 5-6 inches nga tubig sa umahan ug gamita ang certified seeds gikan sa PhilRice.`,
                    'English': `According to DA Bulletin 2024-11, optimal rice planting periods are June-July (wet season) and December-January (dry season). Maintain 5-6 inches of water depth and use PhilRice-certified seeds.`
                };
                
                output.innerHTML = `
                    <strong>🤖 AI Advisor Response:</strong><br><br>
                    ${responses[lang]}<br><br>
                    <em>Sources: DA Bulletin #2024-11, PhilRice Advisory, PAGASA Climate Data</em>
                `;
            }, 2000);
        }

        // Agent 3: Agentic Marketplace with Event Streaming
        function findBuyers() {
            const harvest = document.getElementById('harvest').value;
            const price = document.getElementById('price').value;
            const output = document.getElementById('market-output');
            
            output.innerHTML = '<span class="loading"></span> Agent searching buyers + checking weather/prices...';
            streamEl.innerHTML = '';
            
            // Simulate event-driven stream (Kafka/Flink)
            const events = [
                '[Kafka] Weather: PAGASA - Clear for 3 days ✓',
                '[Flink] Price Stream: NFA buying at ₱23/kg',
                '[API] Lazada Agri: 3 buyers matched',
                '[API] Shopee Fresh: 2 cooperatives interested',
                '[DA-PRISM] No typhoon alerts ✓',
                '[Agent] Best match: NFA Quezon City - ₱24/kg'
            ];
            
            let i = 0;
            const interval = setInterval(() => {
                if (i < events.length) {
                    streamEl.innerHTML += events[i] + '<br>';
                    streamEl.scrollTop = streamEl.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                    output.innerHTML = `
                        <strong>✅ Buyers Found & Logistics Arranged</strong><br><br>
                        <strong>Top Buyer:</strong> NFA Quezon City<br>
                        <strong>Price:</strong> ₱${parseFloat(price) - 1}/kg (₱${(harvest * (price - 1)).toLocaleString()})<br>
                        <strong>Pickup:</strong> Nov 22, 2025 - 8:00 AM<br>
                        <strong>Weather:</strong> Clear (PAGASA confirmed)<br>
                        <strong>Logistics:</strong> Booked via Lazada Logistics<br><br>
                        <button onclick="alert('Booking confirmed! SMS sent to +639XX-XXX-XXXX')">Confirm Booking</button>
                    `;
                }
            }, 600);
        }

        // Initialize
        predictYield();
    </script>
</body>
</html>
